name: Apply Copilot proxy semantics patch

on:
  push:
    branches:
      - feature/copilot-byok-switch-proxy

permissions:
  contents: write

concurrency:
  group: apply-copilot-proxy-semantics-v1
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: feature/copilot-byok-switch-proxy
          fetch-depth: 0

      - name: Apply source patch
        run: python3 .github/scripts/fix_copilot_proxy_semantics.py

      - name: Commit source patch
        run: |
          rm .github/workflows/apply-copilot-proxy-semantics.yml
          rm .github/scripts/fix_copilot_proxy_semantics.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: separate Copilot provider selection from activation"
          git push origin HEAD:feature/copilot-byok-switch-proxy
