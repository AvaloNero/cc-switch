name: Copilot BYOK batch 1

on:
  push:
    branches:
      - feature/copilot-byok-model-catalog

permissions:
  contents: write

concurrency:
  group: copilot-byok-batch1
  cancel-in-progress: false

jobs:
  validate-and-wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feature/copilot-byok-model-catalog
          fetch-depth: 0

      - name: Wire backend module and commands
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src-tauri/src/lib.rs")
          text = path.read_text(encoding="utf-8")

          module_anchor = "mod commands;\nmod config;\n"
          module_replacement = "mod commands;\nmod config;\nmod copilot_byok;\n"
          if "mod copilot_byok;" not in text:
              if text.count(module_anchor) != 1:
                  raise SystemExit("lib.rs module anchor changed")
              text = text.replace(module_anchor, module_replacement, 1)

          command_anchor = "            commands::copilot_get_usage_for_account,\n            // OMO commands\n"
          command_lines = [
              "            commands::copilot_get_usage_for_account,",
              "            // VS Code Copilot BYOK model catalog",
              "            commands::copilot_byok_get_state,",
              "            commands::copilot_byok_set_targets,",
              "            commands::copilot_byok_add_custom_target,",
              "            commands::copilot_byok_remove_custom_target,",
              "            commands::copilot_byok_upsert_model,",
              "            commands::copilot_byok_delete_model,",
              "            commands::copilot_byok_sync,",
              "            commands::copilot_byok_remove_managed_models,",
              "            commands::copilot_byok_restore_backup,",
              "            // OMO commands",
          ]
          command_replacement = "\n".join(command_lines) + "\n"
          if "commands::copilot_byok_get_state," not in text:
              if text.count(command_anchor) != 1:
                  raise SystemExit("lib.rs command anchor changed")
              text = text.replace(command_anchor, command_replacement, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev \
            libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev \
            || sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.0-dev
          sudo apt-get install -y --no-install-recommends libsoup-3.0-dev \
            || sudo apt-get install -y --no-install-recommends libsoup2.4-dev

      - name: Create frontend dist placeholder
        run: mkdir -p dist

      - name: Format Rust changes
        run: cargo fmt --manifest-path src-tauri/Cargo.toml

      - name: Compile and run Copilot BYOK tests
        run: cargo test --manifest-path src-tauri/Cargo.toml copilot_byok --lib

      - name: Verify patch cleanliness
        run: git diff --check

      - name: Commit validated batch
        run: |
          rm .github/workflows/copilot-byok-batch1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: complete Copilot BYOK backend batch 1"
          git push origin HEAD:feature/copilot-byok-model-catalog
