name: Copilot BYOK frontend batch

on:
  push:
    branches:
      - feature/copilot-byok-model-catalog

permissions:
  contents: write

concurrency:
  group: copilot-byok-frontend-batch
  cancel-in-progress: false

jobs:
  validate-and-wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feature/copilot-byok-model-catalog
          fetch-depth: 0

      - name: Wire settings page
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/components/settings/SettingsPage.tsx")
          text = path.read_text(encoding="utf-8")

          import_anchor = 'import { CodexAuthSettings } from "@/components/settings/CodexAuthSettings";\n'
          imports = import_anchor + 'import { CopilotByokSettings } from "@/components/settings/CopilotByokSettings";\nimport copilotByokIcon from "@/assets/icons/vscode-copilot-byok.png";\n'
          if 'CopilotByokSettings' not in text:
              if text.count(import_anchor) != 1:
                  raise SystemExit("SettingsPage import anchor changed")
              text = text.replace(import_anchor, imports, 1)

          accordion_anchor = '''                    >
                      <AccordionItem
                        value="directory"
'''
          copilot_item = '''                    >
                      <AccordionItem
                        value="copilotByok"
                        className="rounded-xl glass-card overflow-hidden"
                      >
                        <AccordionTrigger className="px-6 py-4 hover:no-underline hover:bg-muted/50 data-[state=open]:bg-muted/50">
                          <div className="flex items-center gap-3">
                            <img
                              src={copilotByokIcon}
                              alt="VS Code Copilot"
                              className="h-10 w-10 rounded-lg border object-cover"
                            />
                            <div className="text-left">
                              <h3 className="text-base font-semibold">
                                {t("settings.advanced.copilotByok.title", {
                                  defaultValue: "VS Code Copilot BYOK",
                                })}
                              </h3>
                              <p className="text-sm text-muted-foreground font-normal">
                                {t("settings.advanced.copilotByok.description", {
                                  defaultValue:
                                    "Add compatible custom endpoint models to the VS Code Copilot model picker",
                                })}
                              </p>
                            </div>
                          </div>
                        </AccordionTrigger>
                        <AccordionContent className="px-6 pb-6 pt-4 border-t border-border/50">
                          <CopilotByokSettings />
                        </AccordionContent>
                      </AccordionItem>

                      <AccordionItem
                        value="directory"
'''
          if 'value="copilotByok"' not in text:
              if text.count(accordion_anchor) != 1:
                  raise SystemExit("SettingsPage accordion anchor changed")
              text = text.replace(accordion_anchor, copilot_item, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Setup pnpm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          corepack install
          pnpm --version

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Format changed frontend files
        run: |
          pnpm exec prettier --write \
            src/lib/api/copilotByok.ts \
            src/lib/api/index.ts \
            src/components/settings/CopilotByokModelDialog.tsx \
            src/components/settings/CopilotByokSettings.tsx \
            src/components/settings/SettingsPage.tsx

      - name: TypeScript type check
        run: pnpm typecheck

      - name: Frontend formatting check
        run: pnpm format:check

      - name: Frontend unit tests
        run: pnpm test:unit

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev \
            libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev \
            || sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.0-dev
          sudo apt-get install -y --no-install-recommends libsoup-3.0-dev \
            || sudo apt-get install -y --no-install-recommends libsoup2.4-dev

      - name: Create frontend dist placeholder
        run: mkdir -p dist

      - name: Format Rust changes
        run: cargo fmt --manifest-path src-tauri/Cargo.toml

      - name: Rust Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Copilot BYOK Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml copilot_byok --lib

      - name: Verify patch cleanliness
        run: git diff --check

      - name: Commit validated frontend batch
        run: |
          rm .github/workflows/copilot-byok-frontend-batch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: complete VS Code Copilot BYOK frontend batch"
          git push origin HEAD:feature/copilot-byok-model-catalog
