name: Apply Copilot BYOK batch 3

on:
  push:
    branches:
      - feature/copilot-byok-model-catalog

permissions:
  contents: write

concurrency:
  group: copilot-byok-direct-apply-v1
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feature/copilot-byok-model-catalog
          fetch-depth: 0

      - name: Apply source changes
        run: python3 .github/scripts/finalize_copilot_byok_batch3.py

      - name: Commit source changes
        run: |
          rm .github/workflows/copilot-byok-batch3.yml
          rm .github/scripts/finalize_copilot_byok_batch3.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: import and auto-sync VS Code Copilot BYOK"
          git push origin HEAD:feature/copilot-byok-model-catalog
